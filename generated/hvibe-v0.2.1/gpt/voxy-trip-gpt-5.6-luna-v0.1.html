const cubeGeo=new THREE.BoxGeometry(VOXEL_SIZE,VOXEL_SIZE,VOXEL_SIZE);

/* ===== Pure-data world helpers ===== */
const rowZ=r=>-r*VOXEL_SIZE;
const rowSlope=r=>LEVEL_CONFIG.slope_profile.find(s=>r>=s.start&&r<=s.end)?.delta||0;
const groundY=r=>-r*0.035;

const groups={
  floor:new THREE.Group(),
  walls:new THREE.Group(),
  guards:new THREE.Group(),
  hazards:new THREE.Group(),
  bonuses:new THREE.Group(),
  gates:new THREE.Group()
};
Object.values(groups).forEach(g=>scene.add(g));

function makeInstanced(material,items,castShadow=false,receiveShadow=true){
  if(!items.length)return null;
  const mesh=new THREE.InstancedMesh(cubeGeo,material,items.length);
  mesh.castShadow=castShadow;
  mesh.receiveShadow=receiveShadow;
  const m=new THREE.Matrix4();
  items.forEach((p,i)=>{
    m.makeTranslation(p.x,p.y,p.z);
    mesh.setMatrixAt(i,m);
  });
  mesh.instanceMatrix.needsUpdate=true;
  return mesh;
}

/* ===== Instanced voxel generation ===== */
const floorItems=[],wallItems=[],guardItems=[],rockItems=[],mineItems=[];
const bonusItems={5:[],6:[],7:[]};
const gateItems=[];
for(let r=0;r<LEVEL_CONFIG.total_rows;r++){
  const row=LEVEL_CONFIG.grid[r];
  const z=rowZ(r), y=groundY(r);
  for(let c=0;c<W;c++){
    const id=row[c], x=(c-(W-1)/2)*VOXEL_SIZE;
    if(id===1||id===2) floorItems.push({x,y,z});
    if(id===3) rockItems.push({x,y:y+0.55,z});
    if(id===4) mineItems.push({x,y:y+0.55,z});
    if(id>=5&&id<=7) bonusItems[id].push({x,y:y+1.4,z});
    if(id===8||id===9) gateItems.push({x,y:y+1.5,z,type:id});
  }
  // Stepped canyon walls, chunk-friendly groups.
  if(r%2===0){
    const wallY=y+1.5;
    wallItems.push({x:-7.0,y:wallY,z});
    wallItems.push({x:7.0,y:wallY,z});
  }
  // Cyan guardrail blocks are track boundary accents, not hazards.
  if(r%2===0 && r<290){
    guardItems.push({x:-6.0,y:y+0.55,z});
    guardItems.push({x:6.0,y:y+0.55,z});
  }
}
groups.floor.add(makeInstanced(matSand,floorItems,false,true));
groups.walls.add(makeInstanced(matRock,wallItems,false,true));
groups.guards.add(makeInstanced(matGuard,guardItems,false,true));
groups.hazards.add(makeInstanced(matRock,rockItems,true,true));
groups.hazards.add(makeInstanced(matBasalt,mineItems,true,true));

for(const id of [5,6,7]){
  const mat=id===5?matSpeed:id===6?matJump:matWarp;
  groups.bonuses.add(makeInstanced(mat,bonusItems[id],true,false));
}

/* Gate geometry is still cubic and uses batched instancing. */
const gateArch=[];
gateItems.forEach(g=>{
  for(const side of [-1,1]) gateArch.push({x:g.x+side*2.7,y:g.y,z:g.z});
  for(let k=-2;k<=2;k++) gateArch.push({x:g.x+k*1.35,y:g.y+2.7,z:g.z});
});
groups.gates.add(makeInstanced(matGate,gateArch,false,false));

const input={left:false,right:false,jump:false};
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){input.left=true;e.preventDefault();}
  else if(e.key==="ArrowRight"){input.right=true;e.preventDefault();}
  else if(e.key==="ArrowUp"){input.jump=true;e.preventDefault();}
});
window.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"){input.left=false;e.preventDefault();}
  else if(e.key==="ArrowRight"){input.right=false;e.preventDefault();}
  else if(e.key==="ArrowUp"){input.jump=false;e.preventDefault();}
});

let touchStart=null;
let touchCount=0;
renderer.domElement.addEventListener("touchstart",e=>{
  touchCount=e.touches.length;
  if(gameState==="CRASHED"||gameState==="CLEARED"){resetRun();return;}
  if(e.touches.length>=2){requestJump();return;}
  const t=e.touches[0];
  touchStart={x:t.clientX,y:t.clientY,time:performance.now()};
  input.left=t.clientX<innerWidth/2;
  input.right=t.clientX>=innerWidth/2;
},{passive:false});
renderer.domElement.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(!touchStart||e.touches.length!==1)return;
  const t=e.touches[0];
  const dy=t.clientY-touchStart.y;
  if(dy<-45)requestJump();
},{passive:false});
renderer.domElement.addEventListener("touchend",e=>{
  input.left=false;input.right=false;touchStart=null;touchCount=0;
},{passive:false});

function requestJump(){
  if(gameState==="CRASHED"||gameState==="CLEARED"){resetRun();return;}
  if(grounded){vy=JUMP_FORCE;grounded=false;playJump();}
}

/* ===== Web Audio: entirely algorithmic ===== */
let audioCtx=null,windGain=null,windFilter=null,windSource=null,audioStarted=false;
function ensureAudio(){
  if(audioStarted)return;
  audioStarted=true;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  windSource=audioCtx.createBufferSource();
  windSource.buffer=buffer;windSource.loop=true;
  windFilter=audioCtx.createBiquadFilter();
  windFilter.type="bandpass";windFilter.frequency.value=400;windFilter.Q.value=.7;
  windGain=audioCtx.createGain();windGain.gain.value=.025;
  windSource.connect(windFilter).connect(windGain).connect(audioCtx.destination);
  windSource.start();
}
function tone(freq0,freq1,duration,type="sine",gain=.06){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq0,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,freq1),audioCtx.currentTime+duration);
  g.gain.setValueAtTime(gain,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
  o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);
}
function playJump(){tone(200,650,.12,"sine",.09);}
function playBoost(){
  tone(440,440,.25,"triangle",.08);
  setTimeout(()=>tone(880,880,.25,"triangle",.06),90);
}
function playWarp(){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();
  o.type="sawtooth";o.frequency.setValueAtTime(800,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(200,audioCtx.currentTime+.45);
  lfo.frequency.value=28;lg.gain.value=70;lfo.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.45);
  o.connect(g).connect(audioCtx.destination);lfo.start();o.start();o.stop(audioCtx.currentTime+.45);lfo.stop(audioCtx.currentTime+.45);
}
function playExplosion(){
  if(!audioCtx)return;
  const b=audioCtx.createBuffer(1,audioCtx.sampleRate*.4,audioCtx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
  s.buffer=b;f.type="lowpass";f.frequency.setValueAtTime(80,audioCtx.currentTime);
  g.gain.setValueAtTime(.22,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.4);
  s.connect(f).connect(g).connect(audioCtx.destination);s.start();
}
function playVictory(){
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>tone(f,f,.35,"square",.055),i*130));
}

/* ===== Particle trail: cubic particles, recycled and active-window bounded ===== */
const particleGeo=new THREE.BoxGeometry(.18,.18,.18);
const particleMat=new THREE.MeshBasicMaterial({color:COLOR_NEON_CYAN});
const particlePool=[];
for(let i=0;i<180;i++){
  const m=new THREE.Mesh(particleGeo,particleMat.clone());
  m.visible=false;scene.add(m);
  particlePool.push({mesh:m,life:0,max:.6,vx:0,vy:0,vz:0});
}
let particleCursor=0;
function emitParticle(color,burst=false){
  const p=particlePool[particleCursor++%particlePool.length];
  p.life=0;p.max=burst?.45:.6;
  p.mesh.visible=true;
  p.mesh.position.set(avatar.position.x,avatar.position.y-.35,avatar.position.z+.55);
  p.vx=(Math.random()-.5)*1.4;
  p.vy=Math.random()*.8;
  p.vz=2.0+Math.random()*2;
  p.mesh.scale.setScalar(burst?1.4:1);
  p.mesh.material.color.setHex(color);
}
function updateParticles(dt){
  for(const p of particlePool){
    if(!p.mesh.visible)continue;
    p.life+=dt;
    if(p.life>=p.max){p.mesh.visible=false;continue;}
    p.mesh.position.x+=p.vx*dt;
    p.mesh.position.y+=p.vy*dt;
    p.mesh.position.z+=p.vz*dt;
    p.mesh.scale.multiplyScalar(Math.max(0,1-dt*1.7));
  }
}

/* ===== Game state ===== */
let gameState="READY";
let avatarZ=0,avatarX=0,vy=0,vx=0,forwardSpeed=BASE_SLIDE_SPEED;
let grounded=true,elapsed=0,boostTimer=0;
let trailAccumulator=0;
let lastTime=performance.now();

function currentRow(){
  return Math.max(0,Math.min(LEVEL_CONFIG.total_rows-1,Math.round(-avatar.position.z/VOXEL_SIZE)));
}
function rowGround(r){
  return groundY(Math.max(0,Math.min(LEVEL_CONFIG.total_rows-1,r)));
}
function startRun(){
  ensureAudio();
  gameState="SLIDING";
  stateEl.style.display="none";
  elapsed=0;lastTime=performance.now();
}
function resetRun(){
  avatarX=0;avatarZ=0;vy=0;vx=0;forwardSpeed=BASE_SLIDE_SPEED;grounded=true;boostTimer=0;elapsed=0;
  avatar.position.set(0,1.2,0);
  gameState="SLIDING";stateEl.style.display="none";ensureAudio();
}
function crash(){
  if(gameState!=="SLIDING")return;
  gameState="CRASHED";playExplosion();
  stateEl.innerHTML="CRASHED<small>ARROW UP OR TAP TO RESTART</small>";
  stateEl.style.display="block";
}
function win(){
  if(gameState!=="SLIDING")return;
  gameState="CLEARED";playVictory();
  stateEl.innerHTML="CLEAR<small>"+formatTime(elapsed)+" &nbsp; ARROW UP OR TAP TO RESTART</small>";
  stateEl.style.display="block";
}
function formatTime(t){
  const m=Math.floor(t/60),s=Math.floor(t%60),h=Math.floor((t%1)*100);
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(h).padStart(2,"0");
}
function collisionCheck(){
  const r=currentRow(),start=Math.max(0,r-15),end=Math.min(LEVEL_CONFIG.total_rows-1,r+85);
  const z=avatar.position.z;
  for(let rr=start;rr<=end;rr++){
    const dz=Math.abs(z-rowZ(rr));
    if(dz>.65)continue;
    const row=LEVEL_CONFIG.grid[rr];
    for(let c=0;c<W;c++){
      const id=row[c];
      if(id<3||id>7)continue;
      const x=(c-(W-1)/2);
      if(Math.abs(avatar.position.x-x)<.75 && Math.abs(avatar.position.y-(rowGround(rr)+1.1))<1.5){
        if(id===3||id===4){ if(id===4)spawnExplosionDebris(); crash(); return; }
        if(id===5){ boostTimer=BOOST_DURATION;forwardSpeed=Math.min(MAX_SLIDE_SPEED,forwardSpeed*BOOST_MULTIPLIER); playBoost(); row[c]=1; }
        if(id===6){ vy=SUPER_JUMP_FORCE;grounded=false;playBoost();row[c]=1; }
        if(id===7){ avatar.position.z-=Math.min(WARP_FORWARD_DISTANCE,10.0);avatar.position.y+=WARP_ALTITUDE_BOOST;vy=0;grounded=false;playWarp();row[c]=1; }
      }
    }
  }
}
function spawnExplosionDebris(){
  for(let i=0;i<24;i++)emitParticle(0xffaa00,true);
}

function updatePlayer(dt){
  const r=currentRow();
  if(input.jump&&grounded)requestJump();
  const steer=(input.right?1:0)-(input.left?1:0);
  vx=vx*STEER_DAMPING+steer*STEER_SPEED*dt;
  avatarX+=vx*dt;
  avatarX=Math.max(-5.25,Math.min(5.25,avatarX));

  const slope=rowSlope(r);
  forwardSpeed=Math.min(MAX_SLIDE_SPEED,Math.max(BASE_SLIDE_SPEED,forwardSpeed+(-slope)*dt*18));
  if(boostTimer>0){
    boostTimer=Math.max(0,boostTimer-dt);
    forwardSpeed=Math.min(MAX_SLIDE_SPEED,Math.max(forwardSpeed,BASE_SLIDE_SPEED*BOOST_MULTIPLIER));
  }
  avatar.position.z-=forwardSpeed*dt;

  const gY=rowGround(r)+1.0;
  vy-=GRAVITY*dt;
  avatar.position.y+=vy*dt;

  if(avatar.position.y<=gY && LEVEL_CONFIG.grid[r].some(v=>v===1||v===2)){
    avatar.position.y=gY;
    vy=0;grounded=true;
  }else grounded=false;

  if(avatar.position.y<-12){crash();return;}
  avatar.position.x=avatarX;
  avatar.rotation.z=THREE.MathUtils.lerp(avatar.rotation.z,-vx*.045,.16);

  trailAccumulator+=dt;
  if(trailAccumulator>=.035){
    trailAccumulator=0;
    const c=!grounded?COLOR_NEON_AMBER:(boostTimer>0?COLOR_NEON_MAGENTA:COLOR_NEON_CYAN);
    emitParticle(c,false);
  }
  collisionCheck();
  if(currentRow()>=LEVEL_CONFIG.total_rows-2)win();
}

function updateBonuses(){
  // Dynamic item updates are bounded to the active Z window.
  const r=currentRow(),back=Math.max(0,r-15),front=Math.min(LEVEL_CONFIG.total_rows-1,r+85);
  if(groups.bonuses.children.length){
    const spin=performance.now()*.001;
    groups.bonuses.rotation.y=spin;
    groups.bonuses.position.y=Math.sin(spin*2)*.12;
  }
  for(const p of particlePool){
    if(!p.mesh.visible)continue;
    const pr=-p.mesh.position.z;
    p.mesh.visible=pr>=back&&pr<=front;
  }
}

function updateCamera(){
  const r=currentRow();
  const slope=Math.abs(rowSlope(r));
  const pitch=THREE.MathUtils.clamp(THREE.MathUtils.degToRad(45+slope*260),THREE.MathUtils.degToRad(45),THREE.MathUtils.degToRad(60));
  const distance=THREE.MathUtils.clamp(CAMERA_DISTANCE+slope*3,4.5,6.5);
  const height=THREE.MathUtils.clamp(CAMERA_HEIGHT+slope*4,3.6,5.0);
  const target=new THREE.Vector3(avatar.position.x,avatar.position.y,avatar.position.z);
  const desired=new THREE.Vector3(avatar.position.x,avatar.position.y+height,avatar.position.z+distance);
  camera.position.lerp(desired,CAMERA_LERP);
  const lookDist=Math.max(2,camera.position.y/Math.tan(pitch));
  const look=new THREE.Vector3(target.x,target.y,target.z-lookDist);
  camera.lookAt(look);
  sun.position.set(avatar.position.x+8,avatar.position.y+15,avatar.position.z+12);
  sun.target.position.copy(target);
}

function updateAudio(){
  if(!audioCtx||!windFilter||!windGain)return;
  const normalized=THREE.MathUtils.clamp((forwardSpeed-BASE_SLIDE_SPEED)/(MAX_SLIDE_SPEED-BASE_SLIDE_SPEED),0,1);
  windFilter.frequency.value=400+1400*normalized;
  windGain.gain.value=gameState==="SLIDING"?.018+.035*normalized:.0;
}

function updateHud(){
  hud.textContent="TIME "+formatTime(elapsed);
}

/* ===== Start and render loop ===== */
renderer.domElement.addEventListener("pointerdown",()=>{if(gameState==="READY")startRun();},{passive:true});
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-lastTime)/1000);lastTime=now;
  if(gameState==="READY"){ensureAudio();}
  if(gameState==="SLIDING"){elapsed+=dt;updatePlayer(dt);}
  updateParticles(dt);
  updateBonuses();
  updateCamera();
  updateAudio();
  updateHud();
  renderer.render(scene,camera);
}
avatar.position.set(0,1.2,0);
updateCamera();
updateHud();
requestAnimationFrame(frame);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
