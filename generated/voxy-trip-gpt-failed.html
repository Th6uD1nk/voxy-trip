<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07000d;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

scene.add(floorInstances,wallInstances,itemInstances);
let fi=0,wi=0,ii=0;
for(let r=0;r<LEVEL_CONFIG.total_rows;r++){for(let c=0;c<LEVEL_CONFIG.width;c++){const id=LEVEL_CONFIG.grid[r][c];const m=new THREE.Matrix4().compose(new THREE.Vector3(c-5.5,groundY(r)-0.5,-r),new THREE.Euler(),new THREE.Vector3(0.5,0.5,0.5));if(id===1||id===2)floorInstances.setMatrixAt(fi++,m);else if(id===3||id===4)wallInstances.setMatrixAt(wi++,m);else if(id>=5&&id<=7)itemInstances.setMatrixAt(ii++,m);}}
const avatar=new THREE.Group(), player={x:0,y:1,z:0,row:0,vy:0,vx:0,forward:BASE_SLIDE_SPEED,grounded:true,boostUntil:0,state:"READY",warp:false};
const avatarCore=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:COLOR_AVATAR,emissive:COLOR_AVATAR,emissiveIntensity:.3}));
avatar.add(avatarCore);scene.add(avatar);
function drawAvatar(){
 const c=hexRGB(COLOR_AVATAR);drawCube(player.x,player.y,player.z,.55,.65,.55,COLOR_AVATAR,avatar.rotation.y);
 drawCube(player.x,player.y+.18,player.z-.48,.32,.18,.06,COLOR_NEON_CYAN,avatar.rotation.y);
}

let keys={left:false,right:false},lastTime=performance.now(),elapsed=0,startTime=performance.now(),now=performance.now();
const particles=[];let particleAccumulator=0;
function emitTrail(dt){
 particleAccumulator+=dt;
 if(particleAccumulator>=.025){particleAccumulator=0;const airborne=!player.grounded;particles.push({x:player.x,y:player.y-.55,z:player.z+.35,s:.12,color:airborne?COLOR_NEON_AMBER:(player.boostUntil>now?COLOR_NEON_MAGENTA:COLOR_NEON_CYAN),life:.6,rot:Math.random()*6.28})}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.z+=player.forward*dt*.12;p.y-=dt*.4;p.s*=Math.pow(.05,dt);p.rot+=dt*3;if(p.life<=0)particles.splice(i,1)}
}
function nearestRow(){return Math.max(0,Math.min(LEVEL_CONFIG.total_rows-1,Math.round(-player.z)))}
function rowYAt(r){return groundY(r)}
function collision(){
 const r=nearestRow(),grid=LEVEL_CONFIG.grid[r],c=Math.max(0,Math.min(W-1,Math.floor(player.x+W/2)));
 const id=grid[c]||0;
 if(id===3||id===4){crash(id===4);return}
 if(id===5){activateBoost();grid[c]=1}
 if(id===6){player.vy=SUPER_JUMP_FORCE;player.grounded=false;grid[c]=1;audio.jump()}
 if(id===7){grid[c]=1;player.z-=Math.min(WARP_FORWARD_DISTANCE,10);player.y+=WARP_ALTITUDE_BOOST;player.vy=0;player.grounded=false;player.warp=true;audio.warp()}
 if(id===9){win()}
}
function activateBoost(){player.boostUntil=now+BOOST_DURATION*1000;audio.boost()}
function crash(explode){
 if(player.state!=="SLIDING")return;player.state="CRASHED";document.getElementById("state").textContent="CRASHED";audio.crash(explode);document.getElementById("message").innerHTML="<div><b>CRASHED</b><span>ARROW UP OR TAP TO RESTART</span></div>"
}
function win(){
 if(player.state!=="SLIDING")return;player.state="CLEARED";audio.win();const t=formatTime(elapsed);document.getElementById("state").textContent="CLEARED";document.getElementById("message").innerHTML="<div><b>FINISH</b><span>"+t+"</span><span>ARROW UP OR TAP TO RESTART</span></div>"
}
function reset(){
 player.x=0;player.row=0;player.z=0;player.y=groundY(0)+1;player.vy=0;player.vx=0;player.forward=BASE_SLIDE_SPEED;player.grounded=true;player.boostUntil=0;player.state="SLIDING";player.warp=false;particles.length=0;elapsed=0;startTime=performance.now();document.getElementById("state").textContent="SLIDING";document.getElementById("message").innerHTML="<div><b>VOXY TRIP</b><span>ARROW KEYS / TOUCH TO SLIDE</span></div>";setTimeout(()=>document.getElementById("message").innerHTML="",500)}
function jump(){
 if(player.state==="CRASHED"||player.state==="CLEARED"){reset();return}
 if(player.state!=="SLIDING")return;
 if(player.grounded){player.vy=JUMP_FORCE;player.grounded=false;audio.jump()}
}
function update(dt){
 if(player.state!=="SLIDING")return;
 player.row=nearestRow();
 elapsed=(performance.now()-startTime)/1000;
 const r=nearestRow(),phase=phaseForRow(r),slope=phase.slope;
 player.forward=Math.min(MAX_SLIDE_SPEED,Math.max(BASE_SLIDE_SPEED,player.forward+slope*22*dt));
 if(player.boostUntil>now)player.forward=Math.min(MAX_SLIDE_SPEED,player.forward*BOOST_MULTIPLIER);
 const steer=(keys.right?1:0)-(keys.left?1:0);
 player.vx=player.vx*STEER_DAMPING+steer*STEER_SPEED*dt;
 player.x+=player.vx*dt;player.x=Math.max(-4.3,Math.min(4.3,player.x));
 player.z-=player.forward*dt;
 player.vy-=GRAVITY*dt;
 player.y+=player.vy*dt;
 const gy=groundY(nearestRow())+1;
 if(player.y<=gy&&!player.warp){player.y=gy;player.vy=0;player.grounded=true}else if(player.y<=gy&&player.vy<=0){player.y=gy;player.vy=0;player.grounded=true;player.warp=false}
 if(player.y<-12){crash(false)}
 collision();emitTrail(dt);
 avatar.rotation.z=-player.vx*.045;avatar.rotation.y=player.vx*.035;
 audio.glide(player.forward);
}
function updateCamera(){
 const slope=phaseForRow(nearestRow()).slope;
 const pitchDeg=Math.max(45,Math.min(60,45+slope*110));
 const pitch=pitchDeg*Math.PI/180;
 const dist=Math.min(4.5,Math.max(4.2,4.5-slope*1.2));
 const height=Math.min(4.6,Math.max(4.2,4.5+slope*1.0));
 const target=new THREE.Vector3(player.x,player.y+.35,player.z-2);
 const desired=new THREE.Vector3(player.x,player.y+height*Math.sin(pitch),player.z+dist*Math.cos(pitch));
 camera.position.lerp(desired,CAMERA_LERP);camera.lookAt(target);sun.position.set(player.x+8,player.y+14,player.z+5)
}
function formatTime(t){const m=Math.floor(t/60),s=Math.floor(t%60),h=Math.floor((t%1)*100);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(h).padStart(2,"0")}
document.getElementById("timer").textContent="00:00.00";

const audio=(()=>{
 let ctx=null,wind=null,windGain=null,windFilter=null;
 function ensure(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume()}
 function noiseBuffer(){const b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
 function glide(speed){ensure();if(!wind){wind=ctx.createBufferSource();wind.buffer=noiseBuffer();wind.loop=true;windFilter=ctx.createBiquadFilter();windFilter.type="bandpass";windGain=ctx.createGain();windGain.gain.value=.025;wind.connect(windFilter).connect(windGain).connect(ctx.destination);wind.start()}
 const f=400+(Math.min(MAX_SLIDE_SPEED,speed)-BASE_SLIDE_SPEED)/(MAX_SLIDE_SPEED-BASE_SLIDE_SPEED)*1400;windFilter.frequency.setTargetAtTime(f,ctx.currentTime,.05)}
 function tone(a,b,d,type="triangle"){ensure();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(a,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(1,b),ctx.currentTime+d);g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d+.02)}
 function jump(){tone(200,650,.12,"sine")}
 function boost(){tone(440,880,.25,"triangle");setTimeout(()=>tone(880,1320,.18,"triangle"),80)}
 function warp(){ensure();const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(800,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(200,ctx.currentTime+.45);g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.22,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.48);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.5)}
 function crash(){ensure();const s=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();s.buffer=noiseBuffer();f.type="lowpass";f.frequency.value=80;g.gain.setValueAtTime(.35,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);s.connect(f).connect(g).connect(ctx.destination);s.start();s.stop(ctx.currentTime+.41)}
 function win(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>tone(f,f*1.01,.32,"square"),i*150))}
 return {glide,jump,boost,warp,crash,win}
})();

function keydown(e){
 if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight"&&e.key!=="ArrowUp")return;
 e.preventDefault();
 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
 if(e.key==="ArrowUp")jump();
}
function keyup(e){
 if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight"&&e.key!=="ArrowUp")return;
 e.preventDefault();
 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
}
addEventListener("keydown",keydown,{passive:false});addEventListener("keyup",keyup,{passive:false});

let touchStart=null;
function touchstart(e){
 e.preventDefault();
 if(player.state==="CRASHED"||player.state==="CLEARED"){reset();return}
 if(e.touches.length>=2){jump();return}
 const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY};
 if(t.clientX<innerWidth/2)keys.left=true;else keys.right=true;
}
function touchend(e){
 e.preventDefault();
 if(touchStart&&e.changedTouches[0]){
  const t=e.changedTouches[0],dy=t.clientY-touchStart.y;
  if(dy<-40)jump();
 }
 keys.left=false;keys.right=false;touchStart=null;
}
addEventListener("touchstart",touchstart,{passive:false});addEventListener("touchend",touchend,{passive:false});

function frame(t){
 now=t;const dt=Math.min(.033,(t-lastTime)/1000);lastTime=t;
 update(dt);updateCamera();
 document.getElementById("timer").textContent=formatTime(elapsed);
 renderer.render(scene,camera);
 requestAnimationFrame(frame)
}
reset();player.y=groundY(0)+1;camera.position.set(0,4.2,5.5);camera.lookAt(new THREE.Vector3(0,1,-2));
requestAnimationFrame(frame);
</script>
</body>
